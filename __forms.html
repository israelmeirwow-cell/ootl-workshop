<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8" /><meta name="robots" content="noindex" /><title>forms</title></head>
<body>
<!--
  Netlify Forms skeleton. The page itself is drawn by JavaScript, so Netlify cannot see its form;
  these hidden copies register the two forms at deploy time. Field names must match src/lib/order.ts.
  Submissions: Netlify dashboard → the site → Forms (registrations, payments).
-->
  <form name="registrations" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="registrations" />
    <input type="hidden" name="subject" value="נרשמ/ה לסדנת יציאה מהלופ" />
    <input type="text" name="name" />
    <input type="text" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="age" />
    <input type="text" name="instagram" />
    <input type="text" name="describe" />
    <input type="text" name="tried" />
    <input type="text" name="status" />
    <input type="text" name="idea" />
    <input type="text" name="pairName" />
    <input type="text" name="pairPhone" />
    <input type="text" name="referrer" />
    <input type="text" name="parentOk" />
    <input type="text" name="ticket" />
    <input type="text" name="seats" />
    <input type="text" name="amount" />
    <input type="text" name="tier" />
    <input type="text" name="waitlist" />
    <input type="text" name="code" />
    <input type="text" name="id" />
    <input type="text" name="type" />
    <input type="text" name="utm_source" />
    <input type="text" name="utm_medium" />
    <input type="text" name="utm_campaign" />
    <input type="text" name="utm_content" />
    <input type="text" name="utm_term" />
    <input type="text" name="fbclid" />
    <input type="text" name="ttclid" />
    <input type="text" name="referrer_url" />
    <input type="text" name="landing" />
  </form>
  <form name="payments" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="payments" />
    <input type="hidden" name="subject" value="דיווח תשלום וקוד כניסה, סדנת יציאה מהלופ" />
    <input type="text" name="name" />
    <input type="text" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="age" />
    <input type="text" name="instagram" />
    <input type="text" name="describe" />
    <input type="text" name="tried" />
    <input type="text" name="status" />
    <input type="text" name="idea" />
    <input type="text" name="pairName" />
    <input type="text" name="pairPhone" />
    <input type="text" name="referrer" />
    <input type="text" name="parentOk" />
    <input type="text" name="ticket" />
    <input type="text" name="seats" />
    <input type="text" name="amount" />
    <input type="text" name="tier" />
    <input type="text" name="waitlist" />
    <input type="text" name="code" />
    <input type="text" name="id" />
    <input type="text" name="type" />
    <input type="text" name="utm_source" />
    <input type="text" name="utm_medium" />
    <input type="text" name="utm_campaign" />
    <input type="text" name="utm_content" />
    <input type="text" name="utm_term" />
    <input type="text" name="fbclid" />
    <input type="text" name="ttclid" />
    <input type="text" name="referrer_url" />
    <input type="text" name="landing" />
  </form>
</body>
</html>
